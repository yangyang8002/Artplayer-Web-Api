<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtPlayer - 弹幕视频播放器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2362d5ff'/%3E%3Cstop offset='100%25' stop-color='%237c5cfc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='28,26 28,54 47,40' fill='url(%23g)'/%3E%3Cline x1='47' y1='40' x2='54' y2='26' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='54' y1='26' x2='54' y2='54' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' opacity='.6'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Medium.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Semibold.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Bold.min.css">
    <link rel="stylesheet" href="/api/theme/player.css">
    <style>
        :root, [data-theme="bilibili"]{--bg:#07070d;--surface:#14141f;--border:rgba(255,255,255,0.07);--bili-blue:#00a1d6;--bili-blue-hover:#00b3e6;--bili-pink:#fb7299;--text:#e6e6ee;--text-dim:#9099a3;--danger:#ff4d6a;--radius:12px;--gradient:linear-gradient(135deg,var(--bili-blue),var(--bili-pink));}
        [data-theme="sakura"]{--bg:#1a1218;--surface:#261c24;--bili-blue:#ff85a2;--bili-blue-hover:#ff9db5;--bili-pink:#c792ea;--text:#f5e6ed;--text-dim:#b89aaa;--danger:#ff6188;--gradient:linear-gradient(135deg,#ff85a2,#c792ea);}
        [data-theme="ocean"]{--bg:#0a1628;--surface:#101e36;--bili-blue:#00d4ff;--bili-blue-hover:#33dfff;--bili-pink:#5ce6c6;--text:#d4edf4;--text-dim:#6b9bb0;--danger:#ff5370;--gradient:linear-gradient(135deg,#00d4ff,#5ce6c6);}
        [data-theme="sunset"]{--bg:#1a1018;--surface:#2a1826;--bili-blue:#ff8c42;--bili-blue-hover:#ffa564;--bili-pink:#e06c9f;--text:#f0e0d6;--text-dim:#b09580;--danger:#f44;--gradient:linear-gradient(135deg,#ff8c42,#e06c9f);}
        [data-theme="forest"]{--bg:#0d120b;--surface:#182114;--bili-blue:#64dd17;--bili-blue-hover:#76ff03;--bili-pink:#69f0ae;--text:#d8e8d0;--text-dim:#7a9a6a;--danger:#ff5252;--gradient:linear-gradient(135deg,#64dd17,#69f0ae);}
        [data-theme="mono"]{--bg:#060606;--surface:#141414;--bili-blue:#888;--bili-blue-hover:#aaa;--bili-pink:#ddd;--text:#e8e8e8;--text-dim:#777;--danger:#ccc;--gradient:linear-gradient(135deg,#666,#ccc);}
        [data-theme="cyber"]{--bg:#060618;--surface:rgba(10,10,40,.88);--bili-blue:#00e5ff;--bili-blue-hover:#40f0ff;--bili-pink:#b000ff;--text:#d0f0ff;--text-dim:#60c0d0;--danger:#ff3060;--gradient:linear-gradient(135deg,#00e5ff,#b000ff);}
        [data-theme="shoujo"]{--bg:#1a101a;--surface:rgba(32,18,30,.88);--bili-blue:#ff80a8;--bili-blue-hover:#ffa8c0;--bili-pink:#e860c0;--text:#f8e8f0;--text-dim:#d0a0b8;--danger:#ff5088;--gradient:linear-gradient(135deg,#ff80a8,#e860c0);}
        [data-theme="jrpg"]{--bg:#100e08;--surface:rgba(20,16,10,.88);--bili-blue:#e0b040;--bili-blue-hover:#f0c860;--bili-pink:#c09030;--text:#e8e0d0;--text-dim:#b0a080;--danger:#e04040;--gradient:linear-gradient(135deg,#e0b040,#c09030);}
        [data-theme="neon"]{--bg:#080808;--surface:rgba(14,10,18,.88);--bili-blue:#ff3050;--bili-blue-hover:#ff6080;--bili-pink:#e02070;--text:#f0e8e8;--text-dim:#c08080;--danger:#ff2040;--gradient:linear-gradient(135deg,#ff3050,#e02070);}

        :root{--ctrl-h:clamp(36px,min(11vw,9vh),42px);--icon-btn:clamp(22px,min(6.8vw,6vh),30px);--icon-svg:clamp(14px,min(4.4vw,3.8vh),20px);--danmu-w:clamp(84px,30vw,180px);--danmu-h:clamp(22px,min(7.2vw,6vh),28px);--title-fs:clamp(11px,min(3.3vw,2.8vh),13px);--shot:clamp(32px,min(10vw,9vh),40px);            --dm-font:20;}

        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;height:100dvh;background:var(--bg);font-family:'MiSans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden}
        #app{display:flex;flex-direction:column;width:100%;height:100%}
        #player-wrapper{flex:1;position:relative;background:#000;min-height:0}
        #artplayer{width:100%;height:100%}

        /* ArtPlayer overrides */
        .art-video-player{font-family:'MiSans',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif!important}
        .art-control{color:rgba(255,255,255,.88)!important}
        .art-control:hover{color:var(--bili-blue)!important}
        .art-bottom{padding:0 clamp(8px,3vw,12px);padding-bottom:env(safe-area-inset-bottom,0px)}
        .art-progress{padding:0 clamp(8px,3vw,12px)!important}
        .art-progress-inner{background:linear-gradient(90deg,var(--bili-blue),#00c3f0)!important}
        .art-progress-loaded{background:rgba(255,255,255,.35)!important}
        .art-progress-indicator{background:#fff!important;box-shadow:0 0 6px rgba(0,0,0,.6)!important}
        .art-state{background:rgba(0,0,0,.4)!important;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:50%!important}
        .art-state svg{fill:#fff!important}
        .art-loading svg{filter:drop-shadow(0 0 8px rgba(0,161,214,.6))}
        .art-contextmenu{background:rgba(20,20,24,.96)!important;backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)!important;border-radius:10px!important;color:#fff!important}
        .art-contextmenu-item:hover{background:rgba(255,255,255,.06)!important}
        .art-info{background:rgba(20,20,24,.94)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:10px!important;color:#fff!important}
        .art-notice{background:rgba(0,0,0,.75)!important;border-radius:6px!important;backdrop-filter:blur(6px)}
        .art-video-notice,.art-notice{display:none!important}
        .art-setting-panel,.art-selector-list{background:rgba(20,20,24,.94)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:10px!important;color:#fff!important}
        .art-settings{right:10px!important;bottom:calc(var(--art-control-height) + 6px)!important;top:auto!important;max-height:calc(100% - 100px)!important;max-width:160px!important}
        div.art-video-player.art-backdrop .art-settings{background-color:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
        .art-setting-item{min-height:32px;height:32px!important}
        .art-setting-item-left>*{transition:opacity .25s}
        /* Slider & tooltip overlay: slider rightmost, tooltip to its left.
           Default hidden; on hover, text fades + slider/tooltip appear.
           Slider is 22px tall so the whole row acts as a click target. */
        .art-setting-item{position:relative}
        .art-setting-range{-webkit-appearance:none;appearance:none;position:absolute;right:0;top:50%;transform:translateY(-50%);width:0!important;height:22px!important;opacity:0;pointer-events:none;background:transparent!important;border:0;outline:0;accent-color:var(--bili-blue);transition:width .3s,opacity .3s}
        .art-setting-range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:transparent}
        .art-setting-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--bili-blue);cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,.5);margin-top:-5px;transition:transform .15s}
        .art-setting-range::-webkit-slider-thumb:active{transform:scale(1.2)}
        .art-setting-range::-moz-range-track{height:4px;border-radius:2px;background:transparent}
        .art-setting-range::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--bili-blue);cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,.5)}
        .art-setting-range::-moz-range-progress{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--bili-blue),#00c3f0)}
        .art-setting-item-right-tooltip{position:absolute;right:0;top:50%;transform:translateY(-50%);opacity:0;white-space:nowrap;transition:right .3s,opacity .25s}
        .art-setting-item:hover .art-setting-range{width:120px!important;opacity:1;pointer-events:auto}
        .art-setting-item:hover .art-setting-item-right-tooltip{right:125px;opacity:1}
        .art-setting-item:hover .art-setting-item-left>*{opacity:0}
        .art-selector-list{bottom:calc(var(--art-control-height) + 6px)!important}
        .art-fullscreen{--art-control-icon-scale:1!important;--art-indicator-size:16px!important}
        .art-fullscreen-web{--art-control-icon-scale:1!important;--art-indicator-size:16px!important}
        .art-setting-item:hover,.art-selector-list-item:hover{background:rgba(255,255,255,.06)!important}
        .art-volume-inner{background:rgba(10,10,24,.9)!important;backdrop-filter:none!important}
        .art-volume-loaded{background:linear-gradient(180deg,var(--bili-blue),#00c3f0)!important}

        /* Danmaku canvas */
        #danmaku-canvas{position:absolute;inset:0;z-index:30;width:100%;height:100%;pointer-events:none}

        /* Danmaku input */
        .bili-danmu{position:relative;display:flex;align-items:center;gap:clamp(4px,1.5vw,6px);height:100%;padding:0 clamp(4px,1.5vw,8px);pointer-events:auto;flex-shrink:1;min-width:0}
        .bili-danmu .bd-input{width:var(--danmu-w);min-width:60px;flex-shrink:1;height:var(--danmu-h);padding:0 12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:14px;font-size:12.5px;color:#fff;outline:none;transition:all .25s;box-sizing:border-box}
        .bili-danmu .bd-input:focus{background:rgba(255,255,255,.2);border-color:var(--bili-blue)}
        .bili-danmu .bd-input::placeholder{color:rgba(255,255,255,.55)}
        .bili-danmu .bd-color{position:relative;width:clamp(20px,6vw,24px);height:clamp(20px,6vw,24px);flex:0 0 clamp(20px,6vw,24px);border:none;border-radius:50%;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .bili-danmu .bd-color .dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 4px rgba(0,0,0,.4)}
        .bili-danmu .bd-color-panel{position:absolute;bottom:calc(var(--art-control-height)+34px);right:0;display:none;flex-direction:column;gap:8px;padding:12px;background:rgba(20,20,24,.94);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:10px;z-index:20}
        .bili-danmu .bd-color-panel.open{display:flex}
        .bili-danmu .bd-colors{display:flex;gap:8px}
        .bili-danmu .bd-colors button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .15s;padding:0}
        .bili-danmu .bd-colors button:hover{transform:scale(1.2)}
        .bili-danmu .bd-colors button.active{border-color:#fff;box-shadow:0 0 0 2px var(--bili-blue)}
        .bili-danmu .bd-types{display:flex;gap:6px}
        .bili-danmu .bd-types button{flex:1;padding:4px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:none;color:rgba(255,255,255,.8);font-size:12px;cursor:pointer;transition:all .2s}
        .bili-danmu .bd-types button.active{background:var(--bili-blue);border-color:var(--bili-blue);color:#fff}
        .bili-danmu .bd-send{width:clamp(22px,7vw,28px);height:clamp(22px,7vw,28px);flex:0 0 clamp(22px,7vw,28px);border:none;border-radius:50%;background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .bili-danmu .bd-send:hover{color:var(--bili-pink);background:rgba(251,114,153,.12)}

        /* Screenshot */
        .bili-screenshot{position:absolute;right:clamp(10px,3vw,14px);top:50%;transform:translateY(-50%);width:var(--shot);height:var(--shot);border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:8;transition:all .2s;opacity:0;pointer-events:none}
        .art-video-player.art-control-show .bili-screenshot,.art-video-player.art-hover .bili-screenshot{opacity:1;pointer-events:auto}
        .bili-screenshot:hover{background:rgba(0,0,0,.55);color:var(--bili-blue);transform:translateY(-50%) scale(1.08)}

        /* Overflow */
        .bili-overflow-panel{position:absolute;right:clamp(8px,3vw,12px);bottom:calc(var(--art-control-height)+env(safe-area-inset-bottom,0px)+6px);background:rgba(20,20,24,.94);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:10px;display:none;flex-direction:column;padding:4px;z-index:30;min-width:130px}
        .bili-overflow-panel.open{display:flex}
        .bili-overflow-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;color:rgba(255,255,255,.9);font-size:12.5px;transition:background .2s;border:none;background:none;white-space:nowrap;font-family:'MiSans','Microsoft YaHei',sans-serif;width:100%;box-sizing:border-box;text-align:left}
        .bili-overflow-item:hover{background:rgba(255,255,255,.06)}
        .bili-overflow-item .item-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(255,255,255,.8)}
        .bili-overflow-item .item-icon svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:16px;height:16px}
        .bili-overflow-item .item-label{flex:1}

        /* Stats */
         .ap-stats-panel{position:absolute;right:8px;bottom:calc(var(--art-control-height)+20px);background:rgba(20,20,24,.94);border:1px solid rgba(255,255,255,.08);border-radius:10px;min-width:220px;z-index:40;display:none;padding:4px 0}
        .ap-stats-panel.open{display:block}
        .ap-stats-sec{font-size:11px;color:var(--bili-blue);padding:8px 12px 4px;letter-spacing:.5px}
        .ap-stats-row{display:flex;align-items:center;justify-content:space-between;padding:3px 12px;font-size:12px;color:rgba(255,255,255,.85)}
        .ap-stats-row b{font-weight:500;color:#fff}
        .ap-badge{font-size:10.5px;line-height:16px;padding:0 6px;border-radius:4px;white-space:nowrap}
        .ap-badge.ok{background:rgba(45,211,111,.16);color:#2dd36f}
        .ap-badge.soft{background:rgba(255,190,51,.16);color:#ffbe33}
        .ap-badge.no{background:rgba(255,77,106,.16);color:#ff4d6a}

        /* Overlay */
        #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
        #overlay.active{pointer-events:all}
        .overlay-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:clamp(24px,6vw,40px) clamp(18px,5vw,36px);text-align:center;max-width:460px;width:90%;backdrop-filter:blur(20px);box-shadow:0 8px 60px rgba(0,0,0,.6)}
        .overlay-card .icon{width:clamp(48px,15vw,64px);height:clamp(48px,15vw,64px);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto clamp(12px,5vw,20px);font-size:clamp(20px,7vw,26px)}
        .overlay-card .icon.error{background:rgba(255,77,106,.15);color:var(--danger)}
        .overlay-card .icon.loading{background:linear-gradient(135deg,var(--bili-blue),var(--bili-pink));color:#fff;animation:pulse 1.5s ease-in-out infinite}
        .overlay-card h2{color:#fff;font-size:clamp(17px,5vw,20px);font-weight:600;margin-bottom:8px}
        .overlay-card p{color:var(--text-dim);font-size:clamp(12.5px,3.6vw,14px);line-height:1.6}
        .overlay-card .code{font-family:'Fira Code','Cascadia Code',monospace;color:var(--bili-blue);font-size:13px;word-break:break-all}
        .overlay-card input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none;transition:border-color .2s;margin-top:16px}
        .overlay-card input:focus{border-color:var(--bili-blue)}
        .overlay-card input::placeholder{color:#555}
        .overlay-card button{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--bili-blue),var(--bili-pink));color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;transition:transform .15s,box-shadow .15s}
        .overlay-card button:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,161,214,.3)}

        #toast{position:fixed;top:clamp(12px,4vw,20px);left:50%;transform:translateX(-50%) translateY(-120px);padding:clamp(10px,3vw,12px) clamp(20px,7vw,28px);border-radius:24px;background:var(--surface);border:1px solid var(--border);color:#fff;font-size:clamp(11px,3.4vw,13px);backdrop-filter:blur(12px);z-index:999;transition:transform .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
        #toast.show{transform:translateX(-50%) translateY(0)}
        .hidden{display:none!important}

        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(.96)}}

        @media(max-width:640px){.bili-overflow-panel{right:8px}}
    </style>
</head>
<body>
    <div id="app">
        <div id="player-wrapper">
            <div id="artplayer"></div>
            <canvas id="danmaku-canvas"></canvas>
            <div id="overlay" class="active">
                <div class="overlay-card" id="welcomeCard">
                    <div class="icon loading">&#9654;</div>
                    <h2>ArtPlayer 弹幕播放器</h2>
                    <p>在地址栏添加 <span class="code">?url=视频链接</span> 开始播放</p>
                    <input type="text" id="urlInput" placeholder="粘贴视频地址 (支持 mp4 / m3u8 / flv)" data-i18n-ph="粘贴视频地址 (支持 mp4 / m3u8 / flv)">
                    <button onclick="loadFromInput()">开始播放</button>
                </div>
                <div class="overlay-card hidden" id="errorCard">
                    <div class="icon error">&#10006;</div>
                    <h2>播放出错</h2>
                    <p id="errorText"></p>
                    <input type="text" id="urlInputRetry" placeholder="重新输入视频地址" data-i18n-ph="重新输入视频地址">
                    <button onclick="loadFromInput(true)">重试</button>
                </div>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script src="/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>

    <script>
(function(){
    I18N.init();
    var t=I18N.t;
    var art=null, vid='', dmEngine=null;
    var danmakuVisible=true, danmakuOpacity=parseFloat(localStorage.getItem('ap_dm_opacity'))||1, danmakuSpeed=parseFloat(localStorage.getItem('ap_dm_speed'))||7, danmakuMask=parseInt(localStorage.getItem('ap_dm_mask')||'0')||0;
    var subtitleVisible=true, subtitleSize=parseInt(localStorage.getItem('ap_sub_fs'))||20, subtitleBottom=parseInt(localStorage.getItem('ap_sub_bottom'))||15;
    var subtitleList=[], currentSub=-1;
    var currentTheme=localStorage.getItem('ap_theme')||'bilibili';
    var _overflowSystem=null;

    function qs(n){return new URLSearchParams(location.search).get(n)}
    function showToast(m,e){
        var t=document.getElementById('toast');t.textContent=m;t.className=e?'toast show err':'toast show';
        if(e)t.style.background='rgba(255,77,106,.2)';clearTimeout(t._timer);
        t._timer=setTimeout(function(){t.classList.remove('show');t.style.background=''},2500);
    }
    function showError(m){
        document.getElementById('errorText').textContent=m;document.getElementById('welcomeCard').classList.add('hidden');
        document.getElementById('errorCard').classList.remove('hidden');document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('overlay').classList.add('active');
    }
    function hideOverlay(){document.getElementById('overlay').classList.add('hidden')}
    function loadFromInput(retry){
        var input=retry?document.getElementById('urlInputRetry'):document.getElementById('urlInput');
        var url=input.value.trim();if(!url){showToast(t('请输入视频地址'),true);return}initPlayer(url);
    }
    function getVideoId(url){
        var v=url;try{var u=new URL(url);v=u.pathname+u.search}catch(e){}
        var hash=0;for(var i=0;i<v.length;i++){hash=((hash<<5)-hash)+v.charCodeAt(i);hash|=0}
        return Math.abs(hash).toString(36);
    }
    function getVideoType(url){

    DanmakuEngine.prototype.resize=function(){

        // player), so it follows fullscreen automatically. Only sync the pixel
        // buffer with the actual rendered size here.

        // (base is fully sized at 1000px or wider)

        for(var rs=0;rs<this.topRows;rs++){this.topSlots.push(0);this.bottomSlots.push(0);}

    DanmakuEngine.prototype._render=function(){

            ctx.fillText(item.text,item.x,item.y);
            ctx.shadowColor='transparent';
            ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
        }
        // Pass 2: existing fixed (top/bottom) danmaku above scroll
        for(i=0;i<this.active.length;i++){
            item=this.active[i];
            if(item._done||item.mode===0||item._live)continue;
            alpha=this.opacity;
            if(item.opacity!=null)alpha*=item.opacity;
            ctx.globalAlpha=alpha;
            ctx.shadowColor='rgba(0,0,0,0.8)';
            ctx.shadowBlur=2;
            ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;
            ctx.fillStyle=item.color;
            ctx.fillText(item.text,item.x,item.y);
            ctx.shadowColor='transparent';
            ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
        }
        // Pass 3: newly sent (live) top/bottom danmaku on top
        for(i=0;i<this.active.length;i++){
            item=this.active[i];
            if(item._done||item.mode===0||!item._live)continue;
            alpha=this.opacity;
            if(item.opacity!=null)alpha*=item.opacity;
            ctx.globalAlpha=alpha;
            ctx.shadowColor='rgba(0,0,0,0.8)';
            ctx.shadowBlur=2;
            ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;
            ctx.fillStyle=item.color;
            ctx.fillText(item.text,item.x,item.y);
            ctx.shadowColor='transparent';
            ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
        }

    /* ===== Init Player ===== */
    async function initPlayer(url){
        /* qs('url') 已解码一次（页面级编码）；此处必须原样使用，
           签名 URL 的查询串被二次解码会破坏签名（SignatureDoesNotMatch） */
        var decoded=url.trim();
        if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(decoded)&&!decoded.startsWith('/'))decoded='/'+decoded;

        var serverTheme=null,serverRender=null;
        try{
            var r=await fetch('/api/config/public');var d=await r.json();
            if(d.code===0){
                if(d.data.cdn&&d.data.cdn.enabled&&d.data.cdn.baseUrl){
                    var base=d.data.cdn.baseUrl.replace(/\/+$/,'');
                    if(!/^https?:\/\//i.test(decoded))decoded=base+(decoded.startsWith('/')?'':'/')+decoded;
                }
                serverTheme=d.data.theme;
                serverRender=d.data.render||null;
            }
        }catch(e){}

        var subtitleUrl=qs('subtitle')||'';
        if(!subtitleUrl){
            try{
                var sr=await fetch('/api/subtitle/detect?url='+encodeURIComponent(decoded));
                var sd=await sr.json();
                if(sd.code===0&&sd.data.subtitles&&sd.data.subtitles.length){
                    subtitleList=sd.data.subtitles;
                    subtitleUrl=subtitleList[0].url;
                    currentSub=0;
                }
            }catch(e){}
        }

        var videoType=getVideoType(decoded);
        var title=qs('title')||decoded.split('/').pop()||decoded;

        /* 视频ID：优先 URL 参数，否则服务端分配/查映射（8位唯一ID），失败时本地散列兜底 */
        vid=qs('vid')||'';
        if(!vid){
            try{
                var vr=await fetch('/api/video/resolve?url='+encodeURIComponent(decoded));
                var vd=await vr.json();
                if(vd.code===0&&vd.data.vid)vid=vd.data.vid;
            }catch(e){}
        }
        if(!vid)vid=getVideoId(decoded);

        try{fetch('/api/video/map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vid:vid,url:decoded})}).catch(function(){})}catch(e){}

        var subOption={};
        if(subtitleUrl){
            var subType=subtitleUrl.endsWith('.vtt')||subtitleUrl.endsWith('.webvtt')?'vtt':'srt';
            subOption={url:subtitleUrl,type:subType,encoding:'utf-8',style:{color:'#fff',fontSize:'20px'}};
        }

        var customType={
            m3u8:function(video,src,artInst){
                if(Hls&&Hls.isSupported()){var hls=new Hls();hls.loadSource(src);hls.attachMedia(video);artInst.hls=hls;artInst.on('destroy',function(){hls.destroy()})}
                else if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=src;
            },
            flv:function(video,src,artInst){
                if(flvjs&&flvjs.isSupported()){var flv=flvjs.createPlayer({type:'flv',url:src});flv.attachMediaElement(video);flv.load();artInst.flv=flv;artInst.on('destroy',function(){flv.destroy()})}
            }

    function statsEl(id){return document.getElementById(id)}
    function fmtTime(s){if(!isFinite(s))return'—';s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
    function setBadge(id,val){var b=statsEl(id);if(!b)return;var cls='no',txt=t('不支持');if(val==='probably'){cls='ok';txt=t('原生支持')}else if(val==='maybe'){cls='soft';txt=t('可能支持')}b.className='ap-badge '+cls;b.textContent=txt}
    function buildStats(){
        if(!art||!art.video)return;var v=art.video;
        var srcNames={normal:t('MP4 / 直链'),hls:'HLS',flv:'FLV'};var srcType='normal';var url=(art.option&&art.option.url)||'';
        if(url.includes('.m3u8'))srcType='hls';else if(url.includes('.flv'))srcType='flv';statsEl('st-src').textContent=srcNames[srcType]||srcType;
        var codec='';if(srcType==='hls'&&art.hls){var lv=art.hls.levels&&art.hls.levels[art.hls.currentLevel||0];codec=(lv&&(lv.videoCodec||(lv.attrs&&lv.attrs.CODECS)))||''}else if(srcType==='flv'&&art.flv&&art.flv.mediaInfo)codec=art.flv.mediaInfo.videoCodec||'';statsEl('st-codec').textContent=codec||t('浏览器原生解码');
        statsEl('st-res').textContent=(v.videoWidth&&v.videoHeight)?v.videoWidth+' × '+v.videoHeight:'—';statsEl('st-dur').textContent=fmtTime(v.duration);
        var sup=detectCodecs();setBadge('st-h264',sup.h264);setBadge('st-hevc',sup.hevc);setBadge('st-hevc10',sup.hevc10);setBadge('st-av1',sup.av1);setBadge('st-vp9',sup.vp9);

    function detectCodecs(){var v=document.createElement('video');var p=function(m){try{return v.canPlayType(m)}catch(e){return''}};return{h264:p('video/mp4; codecs="avc1.42E01E"')||p('video/mp4; codecs="avc1.64001F"'),hevc:p('video/mp4; codecs="hev1.1.6.L93.B0"')||p('video/mp4; codecs="hvc1.1.6.L93.B0"'),hevc10:p('video/mp4; codecs="hev1.2.4.L120.90"')||p('video/mp4; codecs="hvc1.2.4.L120.90"'),av1:p('video/mp4; codecs="av01.0.05M.08"')||p('video/webm; codecs="av01.0.05M.08"'),vp9:p('video/webm; codecs="vp9"')}}
    async function probeMediaCaps(){if(!navigator.mediaCapabilities||!navigator.mediaCapabilities.decodingInfo)return;var items=[{id:'mc-hevc-1080',mime:'video/mp4; codecs="hev1.1.6.L93.B0"',w:1920,h:1080,br:8000000},{id:'mc-hevc-4k',mime:'video/mp4; codecs="hev1.2.4.L120.90"',w:3840,h:2160,br:25000000},{id:'mc-av1-1080',mime:'video/mp4; codecs="av01.0.05M.08"',w:1920,h:1080,br:6000000},{id:'mc-av1-4k',mime:'video/mp4; codecs="av01.0.05M.08"',w:3840,h:2160,br:18000000}];for(var i=0;i<items.length;i++){var it=items[i],el=statsEl(it.id);if(!el)continue;            try{var r=await navigator.mediaCapabilities.decodingInfo({type:'file',video:{contentType:it.mime,width:it.w,height:it.h,bitrate:it.br,framerate:30}});if(!r.supported){el.className='ap-badge no';el.textContent=t('不支持')}else if(r.smooth&&r.powerEfficient){el.className='ap-badge ok';el.textContent=t('硬解流畅')}else if(r.smooth){el.className='ap-badge soft';el.textContent=t('流畅')}else{el.className='ap-badge soft';el.textContent=t('软解')}}catch(e){el.className='ap-badge no';el.textContent='—'}}}

    function setupOverflow(){
        var app=document.querySelector('.art-video-player');var bottom=app?app.querySelector('.art-bottom'):null;
        var rightBar=bottom?bottom.querySelector('.art-controls-right'):null;if(!rightBar||document.querySelector('.bili-overflow-btn'))return;
        var overflowBtn=document.createElement('div');overflowBtn.className='art-control bili-overflow-btn';overflowBtn.title=t('更多选项');overflowBtn.innerHTML=ICONS.more();overflowBtn.style.display='none';
        var popup=document.createElement('div');popup.className='bili-overflow-panel';bottom.appendChild(popup);rightBar.appendChild(overflowBtn);
        overflowBtn.addEventListener('click',function(e){e.stopPropagation();popup.classList.toggle('open')});
        document.addEventListener('click',function(e){if(!popup.contains(e.target)&&e.target!==overflowBtn)popup.classList.remove('open')});
        _overflowSystem={overflowBtn:overflowBtn,popup:popup,bottom:bottom,rightBar:rightBar};checkOverflow();
        var ro=new ResizeObserver(function(){checkOverflow()});ro.observe(bottom);
        var ro2=new ResizeObserver(function(){checkOverflow()});ro2.observe(app);
        window.addEventListener('resize',function(){setTimeout(checkOverflow,150)});
        document.fonts&&document.fonts.ready&&document.fonts.ready.then(function(){setTimeout(checkOverflow,300)});
        if(art){
            art.on('fullscreen',function(){setTimeout(checkOverflow,1000)});

    function checkOverflow(){
        var sys=_overflowSystem;if(!sys)return;var overflowBtn=sys.overflowBtn,popup=sys.popup,rightBar=sys.rightBar;
        /* Reset buttons, then collect buttons that stick out of the container. */
        rightBar.querySelectorAll('.art-control').forEach(function(c){c.style.display='';c.classList.remove('bili-overflow-hidden')});
        var hidden=[],rightRect=rightBar.getBoundingClientRect();
        rightBar.querySelectorAll('.art-control').forEach(function(ctrl){if(ctrl===overflowBtn)return;if(ctrl.getBoundingClientRect().right>rightRect.right+4){hidden.push(ctrl);ctrl.style.display='none';ctrl.classList.add('bili-overflow-hidden')}});
        /* Danmaku bar: flex child of the left controls, never overlaps.
           When there is not enough room for it, hide the danmaku bar itself
           and keep every button intact. Space is computed from the player
           geometry so the bar can reappear after the window grows again. */
        var danmuEl=document.querySelector('.bili-danmu');
        if(danmuEl){
            var playerEl2=document.querySelector('.art-video-player');
            var playerW=playerEl2?playerEl2.getBoundingClientRect().width:0;
            var rightW=0;
            var btnEls=[].slice.call(rightBar.children).filter(function(c){return c.offsetWidth>0&&c.offsetHeight>0&&!c.classList.contains('bili-overflow-btn')});
            if(btnEls.length){
                var minL=Math.min.apply(null,btnEls.map(function(c){return c.getBoundingClientRect().left}));
                rightW=rightRect.right-minL;
            }
            var avail=playerW-rightW-160-16;
            var squeeze=avail<220;
            if(squeeze&&!danmuEl.classList.contains('bili-danmu-hidden')){
                danmuEl.classList.add('bili-danmu-hidden');
                danmuEl.style.display='none';
            }else if(!squeeze&&danmuEl.classList.contains('bili-danmu-hidden')){
                danmuEl.classList.remove('bili-danmu-hidden');
                danmuEl.style.display='';
            }
        }
        popup.innerHTML='';if(hidden.length>0){overflowBtn.style.display='';hidden.forEach(function(el){var label=el.getAttribute('title')||el.textContent.trim()||'选项';var iconEl=el.querySelector('svg');var item=document.createElement('button');item.className='bili-overflow-item';var iconWrap=document.createElement('span');iconWrap.className='item-icon';if(iconEl)iconWrap.appendChild(iconEl.cloneNode(true));var labelEl=document.createElement('span');labelEl.className='item-label';labelEl.textContent=label;item.appendChild(iconWrap);item.appendChild(labelEl);item.addEventListener('click',function(e){e.stopPropagation();el.click();popup.classList.remove('open');checkOverflow()});popup.appendChild(item)})}else{overflowBtn.style.display='none';popup.classList.remove('open')}
    }
    /* Danmaku box follows the control bar visibility:
       hidden in mini-progress-bar / lock mode (controls are slid away),
       otherwise the parent .art-bottom opacity handles it. */
    /* ===== Init ===== */
    document.getElementById('urlInput').addEventListener('keypress',function(e){if(e.key==='Enter')loadFromInput()});
    document.getElementById('urlInputRetry').addEventListener('keypress',function(e){if(e.key==='Enter')loadFromInput(true)});
    window.addEventListener('load',function(){setTheme(currentTheme);var url=qs('url');if(url){document.getElementById('urlInput').value=decodeURIComponent(url);initPlayer(url)}});
})();
    </script>
</body>
